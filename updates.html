<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업데이트 — 마이포워더 도구</title>
<meta name="description" content="새 도구, 바뀐 기능, 데이터 갱신을 날짜순으로 적어 둬요. 지금 만들고 있는 것과 고민 중인 것도 함께 남겨요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230a0a0d'/%3E%3Cpath d='M9 22V11l7 7 7-7v11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<meta property="og:site_name" content="마이포워더 도구">
<meta property="og:title" content="업데이트 — 마이포워더 도구">
<meta property="og:description" content="새 도구, 바뀐 기능, 데이터 갱신을 날짜순으로 적어 둬요. 지금 만들고 있는 것과 고민 중인 것도 함께 남겨요.">

<link rel="stylesheet" href="shared/components.css">
<style>
  .upd { display: grid; gap: var(--space-12); max-width: 960px; }
  .upd-head { display: grid; gap: var(--space-4); padding-top: var(--space-12); }
  .upd-head .body-l { max-width: 600px; }

  /* 요즘 만드는 것 — 다크 블록. 색은 큰 D번호와 영역 태그에만 */
  .now { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: var(--space-12); padding: var(--space-12); background: var(--bg-dark); color: var(--on-dark); border-radius: var(--radius-md); }
  .now[hidden] { display: none; }
  .now .eyebrow { color: var(--on-dark-2); }
  .now .eyebrow::before { background: var(--accent); }
  .now__id { display: grid; gap: var(--space-4); align-content: start; }
  .now__no { color: var(--accent); font-size: 80px; line-height: 0.95; font-weight: 500; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .now__name { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .now__tags { display: flex; gap: var(--space-2); }
  .now__steps { list-style: none; margin: var(--space-2) 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .now__steps li { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: var(--radius-pill); border: 1px solid color-mix(in srgb, var(--on-dark) 22%, transparent); color: var(--on-dark-2); font-size: 13px; }
  .now__steps li b { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--on-dark) 12%, transparent); font-family: var(--font-mono); font-size: 11px; font-weight: 400; }
  .now__steps li.is-done { background: var(--on-dark); color: var(--bg-dark); border-color: var(--on-dark); }
  .now__steps li.is-done b { background: var(--bg-dark); color: var(--on-dark); }
  .now__memo { display: grid; gap: var(--space-6); align-content: space-between; padding-left: var(--space-12); border-left: 1px solid color-mix(in srgb, var(--on-dark) 14%, transparent); }
  .now__text { font-size: 20px; line-height: 1.6; letter-spacing: -0.01em; }
  .now__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .byline { display: inline-flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--on-dark-2); }
  .avatar { width: 28px; height: 28px; border-radius: var(--radius-pill); background: var(--on-dark); color: var(--bg-dark); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex: none; }
  .btn-on-dark { background: transparent; color: var(--on-dark); border-color: color-mix(in srgb, var(--on-dark) 32%, transparent); }
  .btn-on-dark:hover { background: color-mix(in srgb, var(--on-dark) 10%, transparent); border-color: var(--on-dark); }

  /* 거르기 */
  .filters { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
  .filters .pill-group { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
  .filters .pill-group::-webkit-scrollbar { display: none; }
  .filters .pill { white-space: nowrap; flex: none; }
  /* 이 페이지는 영역 색이 없어 고른 거르기는 검정으로 */
  .filters .pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .filters .pill[aria-pressed="true"] .pill__count { color: color-mix(in srgb, var(--bg) 64%, transparent); }

  /* 목록 — 날짜 묶음, 같은 날은 날짜를 한 번만 */
  .days { list-style: none; margin: 0; padding: 0; }
  .day { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: var(--space-6); padding: var(--space-6) 0; border-top: 1px solid var(--line); }
  .day:last-child { border-bottom: 1px solid var(--line); }
  .day__date { display: grid; gap: 2px; align-content: start; padding-top: 3px; }
  .day__date .mono { font-size: 13px; color: var(--ink-2); }
  .day__date .caption { color: var(--ink-3); }
  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-6); }
  .item { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  .kind { justify-self: start; padding: 5px 10px; font-size: 12px; }
  .kind--new { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .item__body { display: grid; gap: 6px; min-width: 0; }
  .item__title { font-size: 16px; line-height: 1.6; }
  .item__title b { font-weight: 500; }
  .item__sub { color: var(--ink-2); }
  .item__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); font-size: 13px; color: var(--ink-3); }
  .chip { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; }
  .chip:hover { color: var(--ink); }
  .chip .mono { font-size: 12px; color: var(--ink-3); }
  .chip .tag-area { padding: 2px 8px; font-size: 11px; }
  .text-link { color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
  .text-link:hover { color: var(--ink); text-decoration-color: var(--ink-3); }
  .memo { display: grid; gap: var(--space-3); padding: var(--space-4) var(--space-6); background: var(--card); border-radius: var(--radius-md); }
  .memo .byline { color: var(--ink-3); }
  .memo .avatar { width: 22px; height: 22px; font-size: 10px; background: var(--ink); color: var(--bg); }
  .memo__result { color: var(--ink-2); font-size: 14px; }
  .empty { padding: var(--space-12) var(--space-6); text-align: center; color: var(--ink-2); background: var(--card); border-radius: var(--radius-md); }
  .more { justify-self: center; }
  .upd-foot { color: var(--ink-3); }

  @media (max-width: 768px) {
    .upd { gap: var(--space-8); }
    .upd-head { padding-top: var(--space-4); }
    .upd-head .display-l { font-size: 40px; }
    .now { grid-template-columns: minmax(0, 1fr); gap: var(--space-6); padding: var(--space-8) var(--space-6); }
    .now__no { font-size: 56px; }
    .now__memo { padding-left: 0; padding-top: var(--space-6); border-left: 0; border-top: 1px solid color-mix(in srgb, var(--on-dark) 14%, transparent); }
    .now__text { font-size: 17px; }
    .filters { display: grid; }
    .filters .select { width: 100%; }
    .day { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); padding: var(--space-6) 0; }
    .day__date { display: flex; gap: var(--space-2); align-items: baseline; }
    .item { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); }
    .memo { padding: var(--space-4); }
  }
</style>
</head>
<body>
<header class="site-nav">
  <div class="site-nav__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 17V7l7 7 7-7v10"/></svg></span>
      <span class="label">마이포워더 도구</span>
    </a>
    <a class="btn btn-sm" href="index.html#tools">도구 둘러보기</a>
  </div>
</header>
<main class="page">
  <div class="upd">
    <header class="upd-head">
      <span class="eyebrow">업데이트 소식</span>
      <h1 class="display-l">업데이트</h1>
      <p class="body-l ink-2">새 도구, 바뀐 기능, 데이터 갱신을 날짜순으로 적어 둬요. 만들면서 드리고 싶은 말도 여기에 남겨요.</p>
    </header>

    <section class="now" id="now" hidden aria-label="요즘 만드는 것"></section>

    <section class="upd-list" aria-label="업데이트 기록">
      <div class="filters">
        <div class="pill-group" role="group" aria-label="종류" id="kinds"></div>
        <select class="select select-sm" id="tool" aria-label="도구"></select>
      </div>
      <ol class="days" id="days" style="margin-top: var(--space-6)"></ol>
      <p class="empty body" id="empty" hidden>이 조건에 맞는 기록이 없어요.</p>
      <div style="display: grid; margin-top: var(--space-6)"><button class="btn more" type="button" id="more" hidden>이전 기록 더 보기</button></div>
    </section>

    <p class="caption upd-foot">도구마다 만든 과정 전체(기획·데이터·구현)는 각 도구 페이지 아래쪽에 있어요.</p>
  </div>
</main>
<footer class="site-footer">
  <span>마이포워더 도구 · 포워딩 실무의 반복 업무를 AI로 덜어 내요</span>
  <span>새 도구와 바뀐 내용을 여기서 알려 드려요</span>
</footer>
<script src="shared/page.js" defer></script>
<script>
(() => {
  'use strict';
  const PAGE = 20;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const pad2 = (n) => String(n).padStart(2, '0');
  const AREA = { sales: '영업', ops: '운영' };
  const KINDS = [['all', '전체'], ['new', '새 도구'], ['feat', '기능'], ['data', '데이터'], ['memo', '메모'], ['site', '사이트']];
  const KIND_LABEL = Object.fromEntries(KINDS);
  const WEEK = '일월화수목금토';
  const areasOf = (t) => (Array.isArray(t.area) ? t.area : [t.area]).filter(Boolean);
  // 받침 있으면 '을', 없으면 '를'
  const eulReul = (w) => { const c = w.charCodeAt(w.length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? '을' : '를'; };
  const areaTags = (a) => areasOf({ area: a }).map((x) => `<span class="tag tag-area" data-area="${esc(x)}">${esc(AREA[x] || x)}</span>`).join('');

  let entries = [], tools = [], feedback = null, kind = 'all', tool = new URLSearchParams(location.search).get('tool') || 'all', shown = PAGE;

  function feedbackLink(subject) {
    if (!feedback) return '';
    const href = feedback.href.startsWith('mailto:') ? `${feedback.href.split('?')[0]}?subject=${encodeURIComponent(`[업데이트 의견] ${subject}`)}` : feedback.href;
    return href;
  }
  // 메일은 새 탭을 열지 않는다
  const feedbackTarget = () => (feedback && !feedback.href.startsWith("mailto:") ? " target=\"_blank\" rel=\"noopener\"" : "");

  function build(all, site) {
    tools = all.filter((t) => t.status === 'live');
    const out = [];
    for (const t of tools) {
      const h = t.history || [];
      const firstDeploy = h.findIndex((x) => x.step === '배포');
      if (firstDeploy < 0) continue;
      const lastDeploy = h.map((x) => x.step).lastIndexOf('배포');
      out.push({ date: h[lastDeploy].date, kind: 'new', tool: t, order: 0 });
      h.forEach((x, i) => {
        if (i <= firstDeploy || x.step === '배포') return;
        if (x.step === '수정') out.push({ date: x.date, kind: 'feat', tool: t, text: x.note, order: i });
        if (x.step === '데이터') out.push({ date: x.date, kind: 'data', tool: t, text: x.note, order: i });
      });
    }
    const up = site.updates || {};
    (up.changes || []).forEach((c, i) => out.push({ date: c.date, kind: 'site', text: c.text, order: 100 + i }));
    (up.notes || []).forEach((n, i) => out.push({ date: n.date, kind: 'memo', note: n, tool: all.find((t) => t.slug === n.tool), order: -10 - i }));
    // 최신 날짜 먼저, 같은 날은 메모 → 새 도구 → 나머지(나중에 적은 줄 먼저)
    out.sort((a, b) => b.date.localeCompare(a.date) || a.order - b.order);
    return out;
  }

  function renderNow(now) {
    const box = document.getElementById('now');
    if (!now?.name) return;
    const steps = now.steps || [];
    box.dataset.area = areasOf(now)[0] || 'sales';
    box.innerHTML = `
      <div class="now__id">
        <span class="eyebrow">요즘 만드는 것</span>
        <span class="now__no">D${pad2(now.day)}</span>
        <div class="now__name"><h2 class="heading-2">${esc(now.name)}</h2><span class="now__tags">${areaTags(now.area)}</span></div>
        <ol class="now__steps" aria-label="진행 단계 ${steps.length}개 중 ${now.done || 0}개 끝남">${steps.map((s, i) => `<li class="${i < (now.done || 0) ? 'is-done' : ''}"><b>${i + 1}</b>${esc(s)}</li>`).join('')}</ol>
      </div>
      <div class="now__memo">
        <p class="now__text">${esc(now.text)}</p>
        <div class="now__foot">
          <span class="byline"><span class="avatar" aria-hidden="true">준</span>이준헌 · ${esc(now.date)}</span>
          ${feedback ? `<a class="btn btn-sm btn-on-dark" href="${esc(feedbackLink(now.name))}"${feedbackTarget()}>의견 보내기</a>` : ''}
        </div>
      </div>`;
    box.hidden = false;
  }

  function chip(t) {
    if (!t) return '';
    return `<a class="chip" href="tools/${esc(t.slug)}.html"><span class="mono">D${pad2(t.day)}</span>${esc(t.name)}</a>`;
  }

  function itemHtml(e) {
    if (e.kind === 'memo') {
      const n = e.note;
      return `<li class="item"><span class="tag kind">메모</span><div class="memo">
        <span class="byline"><span class="avatar" aria-hidden="true">준</span>만드는 사람 메모 · ${esc(n.kind || '')}</span>
        <p class="body">${esc(n.text)}</p>
        ${n.result ? `<p class="memo__result">${esc(n.result)}</p>` : ''}
        <div class="item__meta">${chip(e.tool)}${feedback && !n.result ? `<a class="text-link" href="${esc(feedbackLink(n.text.slice(0, 30)))}"${feedbackTarget()}>의견 보내기</a>` : ''}</div>
      </div></li>`;
    }
    if (e.kind === 'new') {
      const t = e.tool;
      return `<li class="item"><span class="tag kind kind--new">새 도구</span><div class="item__body">
        <p class="item__title"><b>${esc(t.name)}</b>${eulReul(t.name)} 열었어요.</p>
        <p class="body item__sub">${esc(t.summary)}</p>
        <div class="item__meta"><span class="chip"><span class="mono">D${pad2(t.day)}</span>${areaTags(t.area)}</span><a class="text-link" href="tools/${esc(t.slug)}.html">써 보기</a></div>
      </div></li>`;
    }
    return `<li class="item"><span class="tag kind">${esc(KIND_LABEL[e.kind])}</span><div class="item__body">
      <p class="item__title">${esc(e.text)}</p>
      ${e.tool ? `<div class="item__meta">${chip(e.tool)}</div>` : ''}
    </div></li>`;
  }

  const match = (e) => (kind === 'all' || e.kind === kind) &&
    (tool === 'all' || (tool === 'site' ? e.kind === 'site' : e.tool?.slug === tool));

  function renderList() {
    const list = entries.filter(match);
    const page = list.slice(0, shown);
    const days = [];
    for (const e of page) { const d = days.at(-1); if (d && d.date === e.date) d.items.push(e); else days.push({ date: e.date, items: [e] }); }
    document.getElementById('days').innerHTML = days.map((d) => {
      const w = WEEK[new Date(`${d.date}T12:00:00Z`).getUTCDay()];
      return `<li class="day"><div class="day__date"><span class="mono">${esc(d.date)}</span><span class="caption">${w}요일</span></div><ol class="items">${d.items.map(itemHtml).join('')}</ol></li>`;
    }).join('');
    document.getElementById('empty').hidden = list.length > 0;
    document.getElementById('more').hidden = list.length <= shown;
    // 종류별 개수(도구 고르기 반영)
    document.querySelectorAll('#kinds .pill').forEach((b) => {
      const k = b.dataset.kind;
      const n = entries.filter((e) => (k === 'all' || e.kind === k) && (tool === 'all' || (tool === 'site' ? e.kind === 'site' : e.tool?.slug === tool))).length;
      b.querySelector('.pill__count').textContent = n;
    });
  }

  function setup() {
    const kinds = document.getElementById('kinds');
    kinds.innerHTML = KINDS.map(([k, l]) => `<button class="pill" type="button" data-kind="${k}" aria-pressed="${k === kind}">${l}<span class="pill__count"></span></button>`).join('');
    kinds.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-kind]'); if (!b) return;
      kind = b.dataset.kind; shown = PAGE;
      kinds.querySelectorAll('.pill').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      renderList();
    });
    const sel = document.getElementById('tool');
    sel.innerHTML = `<option value="all">전체 도구</option>${tools.map((t) => `<option value="${esc(t.slug)}">D${pad2(t.day)} · ${esc(t.name)}</option>`).join('')}<option value="site">사이트</option>`;
    if (![...sel.options].some((o) => o.value === tool)) tool = 'all';
    sel.value = tool;
    sel.addEventListener('change', () => {
      tool = sel.value; shown = PAGE;
      const u = new URL(location.href);
      if (tool === 'all') u.searchParams.delete('tool'); else u.searchParams.set('tool', tool);
      history.replaceState(null, '', u);
      renderList();
    });
    document.getElementById('more').addEventListener('click', () => { shown += PAGE; renderList(); });
  }

  Promise.all([
    fetch('tools.json', { cache: 'no-cache' }).then((r) => r.json()),
    fetch('site.json', { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
  ]).then(([all, site]) => {
    feedback = site.contact?.links?.[0] || null;
    entries = build(all, site);
    renderNow(site.updates?.now);
    setup();
    renderList();
  }).catch(() => {
    const empty = document.getElementById('empty');
    empty.textContent = '기록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.';
    empty.hidden = false;
  });
})();
</script>
</body>
</html>
