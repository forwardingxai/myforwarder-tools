<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공유 이미지 틀</title>
<!-- 도구 공유 이미지(1200×630) 공통 틀. 사용: scripts/share-image.html?slug={slug}
     문구는 tools.json의 share 칸에서, 색은 area(ops 코발트 / sales 라임)에서 정한다.
     스타일 규칙: docs/share-image-guide.md · 이미지 만들기: npm run share-image -- {slug} -->
<link rel="stylesheet" href="../design-tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg-dark); word-break: keep-all; }
  .art {
    width: 1200px; height: 630px; padding: 56px 64px;
    display: grid; grid-template-columns: 1fr 1.18fr; gap: 40px;
    background: var(--bg-dark); color: var(--on-dark); font-family: var(--font-sans);
  }
  .left { display: grid; grid-template-rows: 1fr auto; }
  .left .top { display: grid; gap: 22px; align-content: center; }
  .tag { justify-self: start; display: inline-flex; padding: 8px 18px; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-ink); font-size: 22px; font-weight: 500; }
  h1 { font-size: 70px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.08; }
  .sub { font-size: 27px; color: var(--on-dark-2); line-height: 1.5; }
  .foot { display: grid; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 500; }
  .brand .m { width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--on-dark); color: var(--bg-dark); display: inline-flex; align-items: center; justify-content: center; }
  .brand .m svg { width: 22px; height: 22px; }
  .url { padding-left: 58px; font-size: 22px; color: var(--on-dark-2); }
  .right { display: grid; gap: 22px; align-content: center; }
  .who { font-size: 22px; color: var(--on-dark-2); margin-bottom: -10px; }
  .bubble { justify-self: start; max-width: 100%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.16); border-radius: 30px 30px 30px 8px; padding: 22px 32px; font-size: 38px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; }
  .answer { justify-self: end; max-width: 100%; display: grid; gap: 8px; background: #16161b; border: 1px solid rgba(255,255,255,.12); border-radius: 30px 30px 8px 30px; padding: 26px 36px; }
  .answer .value { font-family: var(--font-mono); font-size: 92px; line-height: 1; letter-spacing: 0.01em; color: var(--accent); white-space: nowrap; }
  .answer .value.text { font-family: var(--font-sans); font-weight: 500; letter-spacing: -0.03em; }
  .answer .note { font-size: 24px; font-weight: 500; color: var(--on-dark-2); }
</style>
</head>
<body>
  <div class="art" id="art">
    <div class="left">
      <div class="top">
        <span class="tag" id="tag"></span>
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="foot">
        <span class="brand"><span class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 17V7l7 7 7-7v10"/></svg></span>마이포워더 도구</span>
        <span class="url">myforwarder-tools.vercel.app</span>
      </div>
    </div>
    <div class="right">
      <p class="who" id="who"></p>
      <p class="bubble" id="question"></p>
      <div class="answer"><p class="value" id="value"></p><p class="note" id="note"></p></div>
    </div>
  </div>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('slug');
  const tools = await (await fetch('../tools.json', { cache: 'no-cache' })).json();
  const t = tools.find((x) => x.slug === slug);
  if (!t || !t.share) { document.body.dataset.error = `tools.json에 ${slug}의 share 칸이 없어요`; return; }
  const s = t.share;
  const AREA = { ops: '운영', sales: '영업' };
  document.body.dataset.area = t.area;
  const setLines = (id, lines) => {
    const el = document.getElementById(id);
    (Array.isArray(lines) ? lines : [lines]).forEach((line, i) => {
      if (i) el.appendChild(document.createElement('br'));
      el.appendChild(document.createTextNode(line));
    });
  };
  document.getElementById('tag').textContent = s.tag || `${AREA[t.area] || ''} · 무료 도구`;
  setLines('title', s.title || t.name);
  setLines('sub', s.sub || t.summary);
  document.getElementById('who').textContent = s.who || '';
  document.getElementById('question').textContent = s.question || '';
  const value = document.getElementById('value');
  value.textContent = s.answer || '';
  if (s.answerStyle === 'text') value.classList.add('text');
  document.getElementById('note').textContent = s.answerNote || '';
  await document.fonts.ready;
  // 넘치는 요소가 있으면 표시(만들기 스크립트가 확인)
  const box = document.getElementById('art').getBoundingClientRect();
  const over = [...document.querySelectorAll('#art *')].some((el) => { const r = el.getBoundingClientRect(); return r.right > box.right + 1 || r.bottom > box.bottom + 1; });
  document.body.dataset.ready = over ? 'overflow' : 'ok';
  // 질문은 한 줄이어야 스타일이 산다 — 두 줄 이상이면 경고
  const q = document.getElementById('question');
  const lines = Math.round((q.getBoundingClientRect().height - 44 - 4) / (parseFloat(getComputedStyle(q).lineHeight) || 49));
  if (lines > 1) document.body.dataset.warn = `질문이 ${lines}줄이에요. 한 줄(약 16자)로 줄여 주세요`;
})();
</script>
</body>
</html>
